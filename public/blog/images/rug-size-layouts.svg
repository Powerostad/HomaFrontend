<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">راهنمای تصویری اندازه فرش پذیرایی</title><desc id="desc">سه چیدمان شماتیک برای فرش کوچک، فرش مناسب زیر پایه‌های جلوی مبل و فرش بزرگ زیر تمام مبلمان</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf8f3"/><stop offset="1" stop-color="#e8e7df"/></linearGradient><pattern id="rug" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 11H22M11 0V22" stroke="#cdb6a0" stroke-width="1" opacity=".6"/><circle cx="11" cy="11" r="3" fill="#b97f66" opacity=".55"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".1"/></filter></defs><rect width="1200" height="680" fill="url(#bg)"/><text x="600" y="78" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="37" font-weight="bold" fill="#1e4238">اندازه فرش را با چیدمان مبل انتخاب کنید</text><text x="600" y="119" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#596a60">نمای شماتیک از بالا • ابعاد واقعی باید اندازه‌گیری شوند</text>
<g><rect x="50" y="158" width="370" height="455" rx="20" fill="#fff" filter="url(#shadow)"/><g><rect x="163" y="333" width="150" height="110" rx="4" fill="#e4b99b" stroke="#b48169" stroke-width="4"/><rect x="163" y="333" width="150" height="110" rx="4" fill="url(#rug)"/><rect x="111" y="238" width="254" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/><rect x="127" y="250" width="72" height="68" rx="12" fill="#dce2d6"/><rect x="204" y="250" width="72" height="68" rx="12" fill="#dce2d6"/><rect x="281" y="250" width="68" height="68" rx="12" fill="#dce2d6"/><rect x="205" y="360" width="70" height="62" rx="27" fill="#8e634c" stroke="#6e4936" stroke-width="3"/><rect x="105" y="388" width="58" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/><rect x="316" y="388" width="58" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/></g><text x="235" y="567" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" font-weight="bold" fill="#243e34">فقط زیر میز</text><text x="235" y="595" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#67756c">معمولاً اتصال بصری ضعیف‌تر</text></g><g><rect x="440" y="158" width="370" height="455" rx="20" fill="#fff" filter="url(#shadow)"/><g><rect x="486" y="291" width="285" height="222" rx="4" fill="#d8b8a1" stroke="#ae8a70" stroke-width="4"/><rect x="486" y="291" width="285" height="222" rx="4" fill="url(#rug)"/><rect x="501" y="238" width="254" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/><rect x="517" y="250" width="72" height="68" rx="12" fill="#dce2d6"/><rect x="594" y="250" width="72" height="68" rx="12" fill="#dce2d6"/><rect x="671" y="250" width="68" height="68" rx="12" fill="#dce2d6"/><rect x="595" y="360" width="70" height="62" rx="27" fill="#8e634c" stroke="#6e4936" stroke-width="3"/><rect x="495" y="388" width="58" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/><rect x="706" y="388" width="58" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/></g><text x="625" y="567" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" font-weight="bold" fill="#243e34">پایه‌های جلو روی فرش</text><text x="625" y="595" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#67756c">انتخاب منعطف برای بیشتر نشیمن‌ها</text></g><g><rect x="830" y="158" width="370" height="455" rx="20" fill="#fff" filter="url(#shadow)"/><g><rect x="858" y="200" width="322" height="346" rx="4" fill="#d7b9a2" stroke="#a9876c" stroke-width="4"/><rect x="858" y="200" width="322" height="346" rx="4" fill="url(#rug)"/><rect x="891" y="238" width="254" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/><rect x="907" y="250" width="72" height="68" rx="12" fill="#dce2d6"/><rect x="984" y="250" width="72" height="68" rx="12" fill="#dce2d6"/><rect x="1061" y="250" width="68" height="68" rx="12" fill="#dce2d6"/><rect x="985" y="360" width="70" height="62" rx="27" fill="#8e634c" stroke="#6e4936" stroke-width="3"/><rect x="885" y="388" width="58" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/><rect x="1096" y="388" width="58" height="95" rx="20" fill="#b2bba9" stroke="#839284" stroke-width="3"/></g><text x="1015" y="567" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" font-weight="bold" fill="#243e34">تمام مبلمان روی فرش</text><text x="1015" y="595" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="13" fill="#67756c">نیازمند فرش بزرگ‌تر و فضای کافی</text></g><text x="600" y="652" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="15" fill="#5b6b62">تصویرسازی اختصاصی هما — نقشه اجراشده یا عکس پروژه واقعی نیست</text></svg>