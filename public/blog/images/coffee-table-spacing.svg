<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f5f3ef"/><text x="1100" y="76" text-anchor="end" font-family="Tahoma,Arial" font-size="40" font-weight="bold" fill="#25463b">فاصله درست مبل و میز جلو مبلی</text><text x="1100" y="119" text-anchor="end" font-family="Tahoma,Arial" font-size="23" fill="#566c60">راهنمای تصویری، نمای بالا — ابعاد تقریبی</text><rect x="235" y="165" width="740" height="160" rx="28" fill="#b8c7bb" stroke="#456455" stroke-width="5"/><rect x="255" y="182" width="215" height="126" rx="20" fill="#e3e9df"/><rect x="498" y="182" width="215" height="126" rx="20" fill="#e3e9df"/><rect x="740" y="182" width="215" height="126" rx="20" fill="#e3e9df"/><text x="605" y="247" text-anchor="middle" font-family="Tahoma,Arial" font-size="29" fill="#315041">مبل سه‌نفره</text><rect x="370" y="425" width="465" height="150" rx="74" fill="#a77754" stroke="#744b35" stroke-width="5"/><text x="602" y="508" text-anchor="middle" font-family="Tahoma,Arial" font-size="28" fill="#fff">میز جلو مبلی</text><line x1="600" y1="331" x2="600" y2="419" stroke="#bb683c" stroke-width="5" stroke-dasharray="10 7"/><path d="M590 346 L600 328 L610 346 M590 404 L600 422 L610 404" stroke="#bb683c" stroke-width="4" fill="none"/><rect x="630" y="347" width="185" height="52" rx="15" fill="#fff"/><text x="722" y="382" text-anchor="middle" font-family="Tahoma,Arial" font-size="24" fill="#9b4c2e">۳۵ تا ۴۵ سانتی‌متر</text><text x="600" y="630" text-anchor="middle" font-family="Tahoma,Arial" font-size="23" fill="#53665c">مسیر رفت‌وآمد اصلی را جداگانه بررسی کنید؛ حدود ۷۵ تا ۹۰ سانتی‌متر فضای باز مطلوب است.</text></svg>