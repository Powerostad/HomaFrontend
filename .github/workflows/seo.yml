name: Frontend SEO gates
on: [push, pull_request]
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/seo-http-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit
          path: reports/seo-ci/
