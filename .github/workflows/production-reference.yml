name: Published production reference
on:
  push:
    branches: [codex/production-server-20261110]
  pull_request:
    paths:
      - 'docs/production/**'
      - 'production/**'
      - 'scripts/verify-production-reference.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify-production-reference.mjs
