services:
  frontend-build:
    image: homa_openai_frontend:credits-price-20261028
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "-c", "echo frontend-built"]
    restart: "no"
  backend-build:
    image: homa_openai_backend:credits-price-20261028
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/credits-price-backend/Dockerfile
    entrypoint: ["/bin/sh", "-c", "echo backend-built"]
    restart: "no"
