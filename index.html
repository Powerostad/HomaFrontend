<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline SVG favicon with brand color -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23E31E24'/><text x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Arial,sans-serif' font-weight='bold' font-size='18' fill='white'>H</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HOMA - پلتفرم هوش مصنوعی برای مشاهده محصولات در فضای شما" />
    <meta name="theme-color" content="#E31E24" />

    <!-- Preconnect to external resources for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Preload LCP image (hero before) - critical for performance -->
    <link rel="preload" as="image" href="/images/hero/before.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/hero/before-mobile.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Preload critical font (Vazirmatn Regular) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HOMA - ببین محصول تو فضات چطوری می‌شینه" />
    <meta property="og:description" content="با هوش مصنوعی HOMA، محصولات رو در فضای خودت مشاهده کن" />
    
    <title>HOMA - مشاهده محصول در فضای شما</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
