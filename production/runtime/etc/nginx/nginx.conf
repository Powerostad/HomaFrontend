# Note: 'user' directive removed - nginx:alpine runs as nginx user by default
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Only the explicitly supported English variant changes the static filename.
    map $arg_lang $information_suffix {
        default "";
        en ".en";
    }

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        image/webp;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Runtime CSP is generated from public runtime env vars before Nginx starts.
    include /etc/nginx/conf.d/runtime-csp.conf;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security
        server_tokens off;

        # Explicitly handle guidance-examples folder (must be before location /)
        # ^~ prefix gives this location higher priority than regex locations
        location ^~ /guidance-examples/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            # Serve files directly, no try_files needed for static files
            try_files $uri =404;
        }

        # Public products have no seller-specific URLs or metadata previews.
        location = /store { add_header X-Robots-Tag "noindex" always; return 404; }
        location ^~ /store/ { add_header X-Robots-Tag "noindex" always; return 404; }

        # HTML mtime/size is not a release identity. Never validate a new build as old.
        location = /index.html {
            etag off;
            if_modified_since off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }
        location = /sw.js {
            etag off;
            if_modified_since off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Runtime config is generated at container startup from environment vars.
        # Do not cache it, otherwise one image cannot safely serve multiple envs.
        location = /config.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Cache static assets (including webp images) - before location /
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            # Ensure files are served
            try_files $uri =404;
        }

        # SEO files MUST bypass the crawler meta-injection proxy in `location /`.
        # Exact-match (`=`) locations take precedence over the prefix `location /`
        # for every User-Agent, so crawler UAs (Googlebot, bingbot, ...) get the
        # real static file instead of being proxied to render-bot (which returns
        # index.html for any non-/store path -> wrong Content-Type for /robots.txt).
        location = /robots.txt {
            try_files $uri =404;
            default_type text/plain;
            access_log off;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /sitemap.xml {
            try_files $uri =404;
            default_type application/xml;
            access_log off;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # Handle client-side routing (must be last)
        # Public information must be readable without JavaScript or authentication.
        # Exact locations also bypass the crawler SPA/meta-injection fallback.
        location = /support { try_files /support$information_suffix.html =404; }
        location = /privacy { try_files /privacy$information_suffix.html =404; }
        location = /terms { try_files /terms$information_suffix.html =404; }
        location = /support/ { return 308 /support$is_args$args; }
        location = /privacy/ { return 308 /privacy$is_args$args; }
        location = /terms/ { return 308 /terms$is_args$args; }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://127.0.0.1:8081;
        }

        # The legacy unversioned URL must revalidate; hashed blog CSS stays immutable.
        location = /blog.css {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Public documents must observe the current release, not an old shell.
        location ~* \.html$ {
            etag off;
            if_modified_since off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /blog { proxy_pass http://127.0.0.1:8081; }
        location ^~ /blog/ { proxy_pass http://127.0.0.1:8081; }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Error pages
        # Document 404s are served by the route handler; never convert them to SPA 200s.
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
