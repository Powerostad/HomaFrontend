# Note: 'user' directive removed - nginx:alpine runs as nginx user by default
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Social/search crawlers that need server-rendered meta tags. Matched
    # case-insensitively; everything else ($is_crawler = 0) gets the static SPA.
    map $http_user_agent $is_crawler {
        default                 0;
        "~*facebookexternalhit" 1;
        "~*Twitterbot"          1;
        "~*Telegram"            1;
        "~*WhatsApp"            1;
        "~*Slackbot"            1;
        "~*LinkedInBot"         1;
        "~*Discordbot"          1;
        "~*Pinterest"           1;
        "~*Googlebot"           1;
        "~*bingbot"             1;
        "~*Applebot"            1;
        "~*redditbot"           1;
        "~*Skype"               1;
        "~*vkShare"             1;
    }

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        image/webp;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Runtime CSP is generated from public runtime env vars before Nginx starts.
    include /etc/nginx/conf.d/runtime-csp.conf;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security
        server_tokens off;

        # Explicitly handle guidance-examples folder (must be before location /)
        # ^~ prefix gives this location higher priority than regex locations
        location ^~ /guidance-examples/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            # Serve files directly, no try_files needed for static files
            try_files $uri =404;
        }

        # Runtime config is generated at container startup from environment vars.
        # Do not cache it, otherwise one image cannot safely serve multiple envs.
        location = /config.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Cache static assets (including webp images) - before location /
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            # Ensure files are served
            try_files $uri =404;
        }

        # Handle client-side routing (must be last)
        location / {
            # Social/search crawlers are proxied to the meta-injection sidecar
            # (render-bot.mjs) so link previews carry per-page Open Graph tags.
            # Static assets are matched by earlier location blocks and never
            # reach this branch. Header directives sit at location level because
            # proxy_set_header is not permitted inside an `if`.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            if ($is_crawler) {
                proxy_pass http://127.0.0.1:8081;
            }
            try_files $uri $uri/ /index.html;
        }

        # Cache HTML files for a short time
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
